<div class="container mt-4">

  <div class="card shadow-lg">

    <div class="card-header bg-primary text-white">

      <h3>User Management</h3>

    </div>

    <div class="card-body">

      <div class="row">

        <div class="col-md-6 mb-3">

          <label>Full Name</label>

          <input
          type="text"
          class="form-control"
          [(ngModel)]="user.fullName">

        </div>

        <div class="col-md-6 mb-3">

          <label>Email</label>

          <input
          type="email"
          class="form-control"
          [(ngModel)]="user.email">

        </div>

        <div class="col-md-6 mb-3">

          <label>Mobile</label>

          <input
          type="text"
          class="form-control"
          [(ngModel)]="user.mobile">

        </div>

        <div class="col-md-6 mb-3">

          <label>Password</label>

          <input
          type="password"
          class="form-control"
          [(ngModel)]="user.password">

        </div>

        <div class="col-md-6 mb-3">

          <label>Role</label>

          <select
          class="form-control"
          [(ngModel)]="user.role">

            <option value="">Select Role</option>
            <option>Admin</option>
            <option>User</option>
            <option>Manager</option>

          </select>

        </div>

        <div class="col-md-6 d-flex align-items-end">

          <button
          *ngIf="!editMode"
          class="btn btn-success me-2"
          (click)="saveUser()">

            Add User

          </button>

          <button
          *ngIf="editMode"
          class="btn btn-warning me-2"
          (click)="updateUser()">

            Update User

          </button>

          <button
          class="btn btn-secondary"
          (click)="resetForm()">

            Reset

          </button>

        </div>

      </div>

      <hr>

      <table class="table table-bordered table-hover">

        <thead class="table-dark">

          <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Role</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let u of users">

            <td>{{u.id}}</td>
            <td>{{u.fullName}}</td>
            <td>{{u.email}}</td>
            <td>{{u.mobile}}</td>
            <td>{{u.role}}</td>

            <td>

              <button
              class="btn btn-warning btn-sm me-2"
              (click)="editUser(u)">

                Edit

              </button>

              <button
              class="btn btn-danger btn-sm"
              (click)="deleteUser(u.id)">

                Delete

              </button>

            </td>

          </tr>

          </tbody>

      </table>

      <div class="d-flex justify-content-between align-items-center mt-3">

        <p class="text-muted mb-0">
          Total Users : <strong>{{users.length}}</strong>
        </p>

        <button
          class="btn btn-primary"
          (click)="getAllUsers()">

          🔄 Refresh

        </button>

      </div>

    </div>

  </div>

</div>
