<div class="container mt-4">

  <div class="card shadow-lg">

    <div class="card-header bg-success text-white">

      <h3>📦 Product Management</h3>

    </div>

    <div class="card-body">

      <div class="row">

        <div class="col-md-6 mb-3">
          <label>Product Name</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="product.productName">
        </div>

        <div class="col-md-6 mb-3">
    <label>Description</label>
    <input
        type="text"
        class="form-control"
        [(ngModel)]="product.description">
</div>

        <div class="col-md-6 mb-3">
          <label>Category</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="product.category">
        </div>

        <div class="col-md-6 mb-3">
    <label>Image URL</label>
    <input
        type="text"
        class="form-control"
        [(ngModel)]="product.imageUrl">
</div>

        <div class="col-md-6 mb-3">
          <label>Price</label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="product.price">
        </div>

        <div class="col-md-6 mb-3">
          <label>Quantity</label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="product.quantity">
        </div>

        <div class="col-md-12 mb-3">

              <label>Status</label>
    <select
        class="form-control"
        [(ngModel)]="product.status">

        <option value="Available">Available</option>
        <option value="Out of Stock">Out of Stock</option>

    </select>

          <button
            *ngIf="!editMode"
            class="btn btn-success me-2"
            (click)="saveProduct()">

            ➕ Add Product

          </button>

          <button
            *ngIf="editMode"
            class="btn btn-warning me-2"
            (click)="updateProduct()">

            ✏ Update Product

          </button>

          <button
            class="btn btn-secondary"
            (click)="resetForm()">

            🔄 Reset

          </button>

        </div>

      </div>

      <hr>

      <div class="row mb-3">

  <div class="col-md-6">

    <input
      type="text"
      class="form-control"
      placeholder="🔍 Search Product..."
      [(ngModel)]="searchText"
      (keyup)="searchProduct()">

  </div>

</div>

      <div class="row mt-4">

  <div class="col-md-3 mb-4" *ngFor="let p of filteredProducts">

    <div class="card shadow h-100">

      <img
        [src]="p.imageUrl"
        class="card-img-top"
        height="220"
        style="object-fit:cover;">

      <div class="card-body">

        <h5>{{p.productName}}</h5>

        <p class="text-muted">
          {{p.description}}
        </p>

        <span class="badge bg-primary">
          {{p.category}}
        </span>

        <h4 class="text-success mt-2">
          ₹ {{p.price}}
        </h4>

        <p class="text-warning fs-5 mb-2">
⭐⭐⭐⭐☆ (4.5)
</p>

<p class="text-success fw-bold">
FREE Delivery
</p>

<div class="d-grid gap-2 mt-3">

<button class="btn btn-warning">
🛒 Add To Cart
</button>

<button class="btn btn-success">
⚡ Buy Now
</button>

</div>

        <p>
          <b>Stock :</b> {{p.quantity}}
        </p>

        <span
          class="badge bg-success"
          *ngIf="p.status=='Available'">

          {{p.status}}

        </span>

        <span
          class="badge bg-danger"
          *ngIf="p.status!='Available'">

          {{p.status}}

        </span>

        <div class="mt-3">

          <button
            class="btn btn-warning btn-sm me-2"
            (click)="editProduct(p)">

            ✏ Edit

          </button>

          <button
            class="btn btn-danger btn-sm"
            (click)="deleteProduct(p.id)">

            🗑 Delete

          </button>

        </div>

      </div>

    </div>

  </div>

</div>

      <div class="d-flex justify-content-between align-items-center mt-3">

        <h5 class="text-success mb-0">
          Total Products :
          <span class="badge bg-success">
            {{products.length}}
          </span>
        </h5>

        <button
          class="btn btn-primary"
          (click)="ngOnInit()">

          🔄 Refresh

        </button>

      </div>

    </div>

  </div>

</div>
